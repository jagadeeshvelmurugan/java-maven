version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: equity-postgres
    environment:
      POSTGRES_USER: equity_app
      POSTGRES_PASSWORD: equity_app
      POSTGRES_DB: equitydb
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity_app -d equitydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [equity-net]

  pgadmin:
    image: dpage/pgadmin4:8.13.0
    container_name: equity-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes: [pgadmin-data:/var/lib/pgadmin]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [equity-net]

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: equitydb
      DB_USERNAME: equity_app
      DB_PASSWORD: equity_app
    ports: ["8080:8080"]
    networks: [equity-net]

volumes:
  pg-data:
  pgadmin-data:

networks:
  equity-net:
    driver: bridge
