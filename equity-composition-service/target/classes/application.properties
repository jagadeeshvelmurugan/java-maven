spring.application.name=equity-composition-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=equity-pool

spring.mvc.async.request-timeout=0

server.port=8080
server.tomcat.max-swallow-size=-1

equity.chunk.size-bytes=1048576
equity.compression.enabled=true
equity.compression.threshold-bytes=4096
equity.compression.algorithm=GZIP

logging.level.com.example.equity=INFO
logging.level.org.springframework.jdbc.core=WARN
